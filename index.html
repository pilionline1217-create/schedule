<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>週行程表</title>
<!-- iPhone 加到主畫面用的圖示與名稱 -->
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1zSYyhW6KzqWMjUg95NVB8TornqhJUmVx=s180">
<link rel="icon" href="https://lh3.googleusercontent.com/d/1zSYyhW6KzqWMjUg95NVB8TornqhJUmVx=s192">
<meta name="apple-mobile-web-app-title" content="週行程表">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6eee3">
<style>
  html,body{margin:0;height:100%;background:#f6eee3}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;
    padding-top:env(safe-area-inset-top,0px);box-sizing:border-box;background:#f6eee3}
  /* 讀取畫面 */
  #splash{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
    background:linear-gradient(rgba(246,238,227,.55),rgba(246,238,227,.7)),
      url("https://lh3.googleusercontent.com/d/19z4_0vgidSUedVYD9uYk11qHNOnGQszP=w1080") 80% center/cover no-repeat,#f6eee3;
    align-items:center;justify-content:center;gap:14px;transition:opacity .4s;
    font-family:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:#2b2622}
  #splash.hide{opacity:0;pointer-events:none}
  #splash img{width:120px;height:120px;border-radius:28px;box-shadow:0 6px 24px rgba(120,80,30,.15)}
  #splash .t{font-size:20px;font-weight:700;letter-spacing:.1em}
  #splash .s{font-size:14px;color:#7a6e61}
  .dots{display:flex;gap:8px;margin-top:4px}
  .dots i{width:9px;height:9px;border-radius:50%;background:#e8a04a;animation:b 1s infinite ease-in-out}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.dots i{animation:none}}
</style>
</head>
<body>
<div id="splash">
  <img src="https://lh3.googleusercontent.com/d/1zSYyhW6KzqWMjUg95NVB8TornqhJUmVx=s256" alt="">
  <div class="t">賣當當週行程表</div>
  <div class="s" id="hello">今天也辛苦了</div>
  <div class="dots"><i></i><i></i><i></i></div>
</div>
<iframe id="app" title="賣當當週行程表" allow="clipboard-write"></iframe>
<script>
// 名字記在入口頁這邊（網址固定，不會因為程式更新而忘記）
var BASE = "https://script.google.com/macros/s/AKfycbyqkFQWddcEoWRnX6XZbS-I0FlLfBKHBeqwefQoBWiyRO1Nj6GnPXrAIHOUKbBLHcof/exec";
var MEMBERS = ["總監", "小男孩", "雜工"];
var me = "";
try { me = localStorage.getItem("wbMe") || ""; } catch (e) {}
if (MEMBERS.indexOf(me) >= 0) document.getElementById("hello").textContent = me + "，今天也辛苦了";
document.getElementById("app").src = BASE + (MEMBERS.indexOf(me) >= 0 ? "?me=" + encodeURIComponent(me) : "");
function hideSplash() { document.getElementById("splash").className = "hide"; }
setTimeout(hideSplash, 15000); // 保險：最多 15 秒就收起來
window.addEventListener("message", function (ev) {
  var host = "";
  try { host = new URL(ev.origin).hostname; } catch (e) { return; }
  if (host.slice(-22) !== ".googleusercontent.com") return;
  var d = ev.data || {};
  if (d.wbReady) hideSplash();
  if (typeof d.wbMe === "string" && MEMBERS.indexOf(d.wbMe) >= 0) {
    try { localStorage.setItem("wbMe", d.wbMe); } catch (e) {}
  }
});
</script>
</body>
</html>
