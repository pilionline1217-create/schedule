<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>週行程表</title>
<!-- iPhone 加到主畫面用的圖示與名稱 -->
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1zSYyhW6KzqWMjUg95NVB8TornqhJUmVx=s180">
<link rel="icon" href="https://lh3.googleusercontent.com/d/1zSYyhW6KzqWMjUg95NVB8TornqhJUmVx=s192">
<meta name="apple-mobile-web-app-title" content="週行程表">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6eee3">
<style>
  html,body{margin:0;height:100%;background:#f6eee3}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;
    padding-top:env(safe-area-inset-top,0px);box-sizing:border-box;background:#f6eee3}
</style>
</head>
<body>
<iframe id="app" title="賣當當週行程表" allow="clipboard-write"></iframe>
<script>
// 名字記在入口頁這邊（網址固定，不會因為程式更新而忘記）
var BASE = "https://script.google.com/macros/s/AKfycbyqkFQWddcEoWRnX6XZbS-I0FlLfBKHBeqwefQoBWiyRO1Nj6GnPXrAIHOUKbBLHcof/exec";
var MEMBERS = ["總監", "小男孩", "雜工"];
var me = "";
try { me = localStorage.getItem("wbMe") || ""; } catch (e) {}
document.getElementById("app").src = BASE + (MEMBERS.indexOf(me) >= 0 ? "?me=" + encodeURIComponent(me) : "");
window.addEventListener("message", function (ev) {
  var host = "";
  try { host = new URL(ev.origin).hostname; } catch (e) { return; }
  if (host.slice(-22) !== ".googleusercontent.com") return;
  var d = ev.data;
  if (d && typeof d.wbMe === "string" && MEMBERS.indexOf(d.wbMe) >= 0) {
    try { localStorage.setItem("wbMe", d.wbMe); } catch (e) {}
  }
});
</script>
</body>
</html>
